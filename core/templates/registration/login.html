<h2>Entrar</h2>
<form method="post">
  {% csrf_token %} <!-- Proteção contra ataques CSRF -->
  {{ form.as_p }} <!-- Renderiza os campos do formulário -->
  <button type="submit">Login</button>
</form>
<p>Não tem conta? <a href="{% url 'register' %}">Cadastre-se aqui</a></p>
